<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <script>
      (function () {
        var path = location.pathname;
        if (path !== '/' && path !== '/index.html') return;
        var supported = function (value) {
          return value === 'pt' || value === 'en';
        };
        var lang = null;
        try {
          lang = localStorage.getItem('intj-lang');
        } catch (error) {
          lang = null;
        }
        if (!supported(lang)) {
          var tags =
            navigator.languages && navigator.languages.length
              ? navigator.languages
              : [navigator.language || ''];
          lang = 'en';
          for (var i = 0; i < tags.length; i++) {
            var base = String(tags[i]).toLowerCase().split('-')[0];
            if (supported(base)) {
              lang = base;
              break;
            }
          }
        }
        location.replace('/' + lang + location.search + location.hash);
      })();
    </script>
    <title>INTJ — o retrato completo</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Um retrato honesto do tipo INTJ: pilha cognitiva, forças e sombras, trabalho, vínculos e crescimento."
    />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#1a1b22" />

    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  </head>
  <body>
    <noscript>
      <div
        style="
          max-width: 44rem;
          margin: 0 auto;
          padding: 1.5rem 1.25rem;
          font-family: system-ui, sans-serif;
          line-height: 1.55;
          color: #e8e6e1;
          background: #1a1b22;
          border-bottom: 1px solid #3a3b45;
        "
      >
        <p lang="pt-BR" style="margin: 0 0 0.5rem">
          <strong>Este site funciona sem JavaScript.</strong> Todo o texto é pré-renderizado — a
          página que você abriu já está inteira aqui. Sem scripts ficam de fora os menus
          <em>Vida</em> e <em>Além do MBTI</em>, o botão de menu no celular, o questionário Espelho
          e a adaptação das páginas ao seu perfil. O índice completo continua no rodapé, em links
          comuns.
        </p>
        <p lang="pt-BR" style="margin: 0 0 1rem">
          Se você usa NoScript ou equivalente: libere também <strong>CSS</strong> para este domínio,
          senão a formatação some por completo, e <strong>fontes</strong> se quiser a tipografia
          como foi desenhada. Ambas são servidas daqui — o site não busca nada de fora, não tem
          analytics, rastreador nem CDN.
        </p>
        <p lang="en" style="margin: 0 0 0.5rem">
          <strong>This site works without JavaScript.</strong> Every page is prerendered — the one
          you opened is already here in full. What scripts do carry: the <em>Vida</em> and
          <em>Além do MBTI</em> dropdowns, the mobile menu button, the Mirror questionnaire and the
          per-profile adaptation. The full index is still in the footer, as ordinary links.
        </p>
        <p lang="en" style="margin: 0">
          If you run NoScript or similar: allow <strong>CSS</strong> for this domain too, or the
          formatting disappears entirely, and <strong>fonts</strong> if you want the typography as
          designed. Both are served from here — the site fetches nothing from anywhere else, and
          carries no analytics, trackers or CDN.
        </p>
      </div>
    </noscript>
    <app-root></app-root>
  </body>
</html>
